name: CD · EAS Build

# Compila en los servidores de Expo (EAS). Los artefactos quedan disponibles en
# el dashboard de Expo; la publicación en tiendas se realiza explícitamente tras
# aprobar un build de producción.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Perfil de eas.json
        type: choice
        options: [preview, production]
        default: preview
  push:
    branches: [Develop, main]

concurrency:
  group: eas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build EAS
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Verificar EXPO_TOKEN
        run: |
          test -n "$EXPO_TOKEN" || {
            echo "::error::Falta el secret EXPO_TOKEN en GitHub Actions."
            exit 1
          }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validar configuración de Expo
        run: npx expo config --type public

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: >
          eas build --non-interactive --no-wait
          --platform ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'android' }}
          --profile ${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.ref_name == 'main' && 'production' || 'preview') }}
