name: EAS Build

# CD: compila la app en los servidores de Expo (EAS).
# Requiere el secret EXPO_TOKEN en Settings → Secrets and variables → Actions.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Perfil de eas.json
        type: choice
        options: [preview, production]
        default: preview
  push:
    branches: [main]

jobs:
  build:
    name: Build ${{ inputs.profile || 'preview' }} (${{ inputs.platform || 'android' }})
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Verificar EXPO_TOKEN
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::warning::Falta el secret EXPO_TOKEN; se omite el build."

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: env.EXPO_TOKEN != ''

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        if: env.EXPO_TOKEN != ''
        run: >
          eas build --non-interactive --no-wait
          --platform ${{ inputs.platform || 'android' }}
          --profile ${{ inputs.profile || 'preview' }}
